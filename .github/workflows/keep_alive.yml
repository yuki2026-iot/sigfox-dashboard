
name: Streamlit Keep Alive

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Access Streamlit
        run: |
          curl -sS -I \
            --max-time 30 \
            --max-redirs 0 \
            "https://sigfox-dashboard-rhcuhj8gx7kjpwimmqjdwh.streamlit.app/"

